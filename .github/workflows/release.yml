# Builds the addon and uploads it to CurseForge (and GitHub Releases)
# when a version tag like v1.0.4 is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # nothing goes to CurseForge unless all local checks pass
      - name: Checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          bash tools/run_all.sh

      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
